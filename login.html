<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Absensi Guru</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <div class="container">
    <div class="login-box">

      <div class="logo">
        <img src="images/logo sd zaha.png" alt="Logo" style="width: 60px; height: auto;">
      </div>

      <h2>ABSENSI GURU</h2>
      <p>SD ZAINUL HASAN GENGGONG</p>

      <!-- Form Login dengan Event Submit -->
      <form id="formLogin" onsubmit="prosesSubmitLogin(event)">

        <div class="input-group">
          <i class="fa fa-user"></i>
          <!-- Tambahan id="username" & required -->
          <input type="text" id="username" placeholder="Username" required>
        </div>

        <div class="input-group">
          <i class="fa fa-lock"></i>
          <!-- Tambahan id="password" & required -->
          <input type="password" id="password" placeholder="Password" required>
        </div>

        <button type="submit">
          <i class="fa fa-sign-in-alt"></i> Login
        </button>

      </form>

      <div class="footer">
        © 2026 SD Zainul Hasan Genggong
      </div>

    </div>
  </div>

  <!-- File JavaScript Login Anda -->
  <script src="js/login.js"></script>

  <!-- Script Penghubung Form ke login.js -->
  <script>
    function prosesSubmitLogin(event) {
      // Mencegah halaman reload otomatis
      event.preventDefault();

      // Ambil nilai dari input
      const userVal = document.getElementById("username").value;
      const passVal = document.getElementById("password").value;

      // Panggil fungsi loginUser dari file js/login.js
      loginUser(userVal, passVal);
    }
  </script>

</body>
</html>
