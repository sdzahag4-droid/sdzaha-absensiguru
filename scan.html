<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absen Selfie Guru</title>

  <!-- Google Fonts: JetBrains Mono & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #09090b;
      --card-bg: #18181b;
      --card-border: #27272a;
      --text-white: #f4f4f5;
      --text-muted: #a1a1aa;
      --divider-color: #3f3f46;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --badge-red: #ef4444;
      --badge-red-bg: rgba(239, 68, 68, 0.15);
      --badge-green-bg: rgba(34, 197, 94, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    /* --- PAGE HEADER --- */
    .header-title {
      width: 100%;
      max-width: 440px;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text-white);
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .btn-back:hover {
      color: var(--text-white);
    }

    /* --- MAIN CARD --- */
    .dashboard-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .divider {
      border: none;
      border-top: 1px dashed var(--divider-color);
      margin: 18px 0;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-white);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* --- AREA KAMERA / SELFIE --- */
    .camera-container {
      width: 100%;
      height: 280px;
      background-color: #000000;
      border: 2px dashed var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      position: relative;
    }

    #webcamVideo, #photoCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror effect kamera depan */
    }

    #photoCanvas {
      display: none;
    }

    .camera-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 30px;
      color: var(--text-muted);
    }

    /* BUTTONS */
    .btn-action {
      width: 100%;
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    .btn-submit {
      background-color: var(--accent-green);
      display: none;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header-title">
    <span>Absen Selfie</span>
    <a href="dashboard.html" class="btn-back">
      <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
      <span>Kembali</span>
    </a>
  </div>

  <!-- CONTAINER CARD -->
  <div class="dashboard-card">

    <div class="section-title" id="titleTipeAbsen">ABSEN SELFIE (MASUK)</div>

    <!-- AREA KAMERA -->
    <div class="camera-container">
      <div class="camera-placeholder" id="cameraPlaceholder">
        <i data-lucide="camera" style="width: 48px; height: 48px; color: var(--text-muted);"></i>
        <span style="font-size: 12px; font-family: 'JetBrains Mono', monospace;">[ Kamera Belum Aktif ]</span>
      </div>

      <!-- DIPERBAIKI: Menambahkan atribut muted agar autoplay aman di semua browser HP -->
      <video id="webcamVideo" autoplay playsinline muted style="display: none;"></video>
      <canvas id="photoCanvas"></canvas>
    </div>

    <!-- TOMBOL AKSI -->
    <button class="btn-action" id="btnBukaKamera">
      <i data-lucide="camera" style="width: 18px; height: 18px;"></i>
      <span>Buka Kamera Depan</span>
    </button>

    <button class="btn-action" id="btnAmbilFoto" style="display: none;">
      <i data-lucide="aperture" style="width: 18px; height: 18px;"></i>
      <span>Ambil Foto</span>
    </button>

    <button class="btn-action btn-submit" id="btnKirimAbsen">
      <i data-lucide="send" style="width: 18px; height: 18px;"></i>
      <span>Kirim Absensi Selfie</span>
    </button>

    <button class="btn-action" id="btnUlangFoto" style="display: none; background-color: #3f3f46;">
      <i data-lucide="refresh-cw" style="width: 18px; height: 18px;"></i>
      <span>Foto Ulang</span>
    </button>

    <hr class="divider">

  </div>

  <!-- MEMANGGIL SCRIPT JS -->
  <script src="js/gps.js"></script>
  <script src="js/scan.js"></script>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
