<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absen Selfie Guru</title>

  <!-- Google Fonts: JetBrains Mono & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #09090b;
      --card-bg: #18181b;
      --card-border: #27272a;
      --text-white: #f4f4f5;
      --text-muted: #a1a1aa;
      --divider-color: #3f3f46;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --badge-red: #ef4444;
      --badge-red-bg: rgba(239, 68, 68, 0.15);
      --badge-green-bg: rgba(34, 197, 94, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    /* --- PAGE HEADER --- */
    .header-title {
      width: 100%;
      max-width: 440px;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text-white);
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .btn-back:hover {
      color: var(--text-white);
    }

    /* --- MAIN CARD --- */
    .dashboard-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .divider {
      border: none;
      border-top: 1px dashed var(--divider-color);
      margin: 18px 0;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-white);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* --- AREA KAMERA / SELFIE --- */
    .camera-container {
      width: 100%;
      height: 280px;
      background-color: #000000;
      border: 2px dashed var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      position: relative;
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror effect kamera depan */
    }

    #canvas {
      display: none;
    }

    #statusScan {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
    }

    /* BUTTONS */
    .btn-action {
      width: 100%;
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header-title">
    <span>Absen Selfie</span>
    <a href="dashboard.html" class="btn-back">
      <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
      <span>Kembali</span>
    </a>
  </div>

  <!-- CONTAINER CARD -->
  <div class="dashboard-card">

    <div class="section-title">ABSEN SELFIE (MASUK)</div>

    <!-- AREA KAMERA -->
    <div class="camera-container">
      <!-- Tag Video Kamera (Diubah ID-nya ke 'webcam') -->
      <video id="webcam" autoplay playsinline muted></video>
      
      <!-- Tag Canvas Tersembunyi untuk Menangkap Foto Kamera (ID: 'canvas') -->
      <canvas id="canvas"></canvas>
    </div>

    <!-- STATUS PROSES -->
    <div id="statusScan"></div>

    <!-- TOMBOL AKSI (Diubah ID-nya ke 'btnAmbilFoto') -->
    <button class="btn-action" id="btnAmbilFoto">
      <i data-lucide="camera" style="width: 18px; height: 18px;"></i>
      <span>Ambil Foto & Absen</span>
    </button>

    <hr class="divider">

  </div>

  <!-- MEMANGGIL SCRIPT JS -->
  <script src="js/gps.js"></script>
  <script src="js/scan.js"></script>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
