<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Pulang</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#000;
    color:#fff;
    padding:20px;
}

h1{
    font-size:42px;
    margin-bottom:20px;
}

.card{
    width:100%;
    max-width:1200px;
    background:#242424;
    border-radius:30px;
    padding:35px;
    position:relative;
    box-shadow:0 0 20px rgba(255,255,255,.05);
}

.copy{
    position:absolute;
    top:25px;
    right:25px;
    font-size:22px;
    cursor:pointer;
}

.label{
    font-size:18px;
    color:#ffffff;
    margin-top:15px;
}

.value{
    font-size:28px;
    font-weight:bold;
    margin-top:12px;
    margin-bottom:35px;
}

button{
    background:#0d6efd;
    color:#fff;
    border:none;
    padding:14px 40px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0b5ed7;
}
</style>

</head>
<body>

<h1>Halaman Pulang</h1>

<div class="card">

<div class="copy">📋</div>

<div class="label">Nama</div>
<div class="value">Ahmad Muzammil</div>

<div class="label">Jam Pulang</div>
<div class="value">13.00</div>

<div class="label">Status</div>
<div class="value">Pulang</div>

<button>KIRIM</button>

</div>

</body>
</html>
