<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#000;
    color:#fff;
    padding:20px;
}

h1{
    font-size:42px;
    margin-bottom:20px;
}

.card{
    width:100%;
    max-width:1200px;
    background:#242424;
    border-radius:28px;
    padding:30px;
    position:relative;
    box-shadow:0 0 15px rgba(255,255,255,.08);
}

.copy{
    position:absolute;
    top:20px;
    right:20px;
    font-size:24px;
    cursor:pointer;
}

.item{
    margin-bottom:28px;
}

.label{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.value{
    font-size:30px;
    color:#fff;
}

hr{
    border:none;
    border-top:1px dashed #888;
    margin:30px 0;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.menu a{
    text-decoration:none;
    color:white;
    font-size:18px;
    transition:.3s;
}

.menu a:hover{
    color:#4da3ff;
    padding-left:10px;
}
</style>

</head>
<body>

<h1>Dashboard Admin</h1>

<div class="card">

<div class="copy">📋</div>

<div class="item">
    <div class="label">Total Guru</div>
    <div class="value">50</div>
</div>

<div class="item">
    <div class="label">Hadir</div>
    <div class="value">48</div>
</div>

<div class="item">
    <div class="label">Belum Hadir</div>
    <div class="value">2</div>
</div>

<hr>

<div class="menu">
    <a href="#">📚 Data Guru</a>
    <a href="#">👨‍💼 Data Karyawan</a>
    <a href="#">📊 Rekap</a>
    <a href="#">⚙️ Pengaturan</a>
    <a href="#">🚪 Logout</a>
</div>

</div>

</body>
</html>
