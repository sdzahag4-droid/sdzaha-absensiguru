<!DOCTYPE html>
<html lang="id">
<head><!-- Menghubungkan manifest.json -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Absensi Guru SD Zainul Hasan Genggong</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-bg: #fee2e2;
      --danger-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    /* HEADER LOGO */
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      background: var(--primary);
      color: white;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.25);
    }

    .brand-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    .brand-header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* CARD LOGIN */
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    /* NOTIFIKASI ERROR */
    .alert-error {
      background-color: var(--danger-bg);
      color: var(--danger-text);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    /* FORM ELEMENTS */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px 12px 44px;
      font-size: 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      outline: none;
      transition: all 0.2s;
      background: #fafafa;
    }

    .form-control:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .btn-toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
    }

    /* ROLE SELECTOR (GURU vs ADMIN) */
    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .role-option {
      position: relative;
    }

    .role-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }

    .role-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      background: #fafafa;
    }

    .role-option input[type="radio"]:checked + .role-label {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    /* ACTION BUTTON & OPTIONS */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .remember-me input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <!-- BRAND HEADER -->
    <div class="brand-header">
      <div class="brand-logo">
        <i data-lucide="shield-check" style="width: 28px; height: 28px;"></i>
      </div>
      <h1>Absensi Guru<br>SD Zainul Hasan Genggong</h1>
      <p>Masuk ke akun Anda untuk melanjutkan</p>
    </div>

    <!-- CARD FORM -->
    <div class="login-card">
      
      <!-- NOTIFIKASI ERROR -->
      <div class="alert-error" id="errorAlert">
        <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
        <span id="errorMessage">NIP / Username dan Password wajib diisi!</span>
      </div>

      <form id="loginForm">
        
        <!-- PILIHAN ROLE (GURU / ADMIN) -->
        <div class="role-selector">
          <div class="role-option">
            <input type="radio" name="role" id="roleGuru" value="guru" checked>
            <label for="roleGuru" class="role-label">
              <i data-lucide="user" style="width: 16px; height: 16px;"></i>
              Guru
            </label>
          </div>
          <div class="role-option">
            <input type="radio" name="role" id="roleAdmin" value="admin">
            <label for="roleAdmin" class="role-label">
              <i data-lucide="user-check" style="width: 16px; height: 16px;"></i>
              Admin
            </label>
          </div>
        </div>

        <!-- INPUT USERNAME / NIP -->
        <div class="form-group">
          <label for="username" id="usernameLabel">NIP / ID Guru</label>
          <div class="input-wrapper">
            <i data-lucide="credit-card" class="input-icon" style="width: 18px; height: 18px;"></i>
            <input type="text" id="username" class="form-control" placeholder="Masukkan NIP Anda" required>
          </div>
        </div>

        <!-- INPUT PASSWORD -->
        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon" style="width: 18px; height: 18px;"></i>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="Lihat Password">
              <i data-lucide="eye" id="eyeIcon" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>

        <!-- REMEMBER ME & FORGOT PASSWORD -->
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            Ingat Saya
          </label>
          <a href="#" class="forgot-link">Lupa password?</a>
        </div>

        <!-- SUBMIT BUTTON -->
        <button type="submit" class="btn-submit">
          <span>Masuk Sekarang</span>
          <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
        </button>

      </form>
    </div>

    <div class="footer-text">
      Copyright &copy; 2026 Presensi Digital Sekolah. All rights reserved.
    </div>

  </div>

  <script>
    // 1. Inisialisasi Icon Lucide
    lucide.createIcons();

    // 2. Element Selectors
    const loginForm = document.getElementById('loginForm');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const roleInputs = document.querySelectorAll('input[name="role"]');
    const usernameLabel = document.getElementById('usernameLabel');
    const usernameInput = document.getElementById('username');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');

    // URL Web App Google Apps Script terbaru Anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIreRt889UFmfNFBksAaj4Gq_WmUIsqaUpV6XeIvU-KGkKbJwfqaC13ZWV7mhiRiuG/exec";

    // 3. Toggle Show/Hide Password
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      if (type === 'text') {
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    });

    // 4. Dynamic Label berdasarkan Role (Guru vs Admin)
    roleInputs.forEach(input => {
      input.addEventListener('change', (e) => {
        if (e.target.value === 'admin') {
          usernameLabel.textContent = 'Username Admin';
          usernameInput.placeholder = 'Masukkan Username';
        } else {
          usernameLabel.textContent = 'NIP / ID Guru';
          usernameInput.placeholder = 'Masukkan NIP Anda';
        }
      });
    });

    // 5. Form Submit & Verifikasi Database
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const selectedRole = document.querySelector('input[name="role"]:checked').value;
      const usernameVal = usernameInput.value.trim();
      const passwordVal = passwordInput.value.trim();

      // Reset alert
      errorAlert.style.display = 'none';

      // Validasi Sederhana
      if (!usernameVal || !passwordVal) {
        showError('Username / NIP dan Password tidak boleh kosong!');
        return;
      }

      const submitBtn = loginForm.querySelector('.btn-submit');
      const originalBtnText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span>Memeriksa...</span>';
      submitBtn.disabled = true;

      // Kirim permintaan pengecekan ke Google Apps Script
      fetch(`${SCRIPT_URL}?action=login&username=${encodeURIComponent(usernameVal)}&password=${encodeURIComponent(passwordVal)}&role=${encodeURIComponent(selectedRole)}`)
        .then(res => res.json())
        .then(data => {
          submitBtn.innerHTML = originalBtnText;
          submitBtn.disabled = false;

          if (data.status === "success") {
            // SIMPAN SESI LOGIN KE BROWSER
            localStorage.setItem("userLoggedIn", JSON.stringify(data.user));

            // Arahkan Halaman Sesuai Role
            if (data.user.role === "admin") {
              window.location.href = 'admin-dashboard.html';
            } else {
              window.location.href = 'dashboard.html';
            }
          } else {
            showError(data.message || "Login Gagal! Periksa kembali username dan password Anda.");
          }
        })
        .catch(err => {
          console.error(err);
          submitBtn.innerHTML = originalBtnText;
          submitBtn.disabled = false;
          showError('Terjadi kesalahan koneksi ke server database.');
        });
    });

function showError(msg) {
        errorMessage.textContent = msg;
        errorAlert.style.display = 'flex';
    }
    </script>

    <!-- TAMBAHKAN KODE REGISTRASI SERVICE WORKER DI SINI -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('pwabuilder-sw.js')
          .then(() => console.log('Service Worker Berhasil Didaftarkan!'))
          .catch((err) => console.log('Service Worker Gagal:', err));
      }
    </script>

</body>
</html>
