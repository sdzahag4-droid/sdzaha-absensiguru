<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan - Admin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#000;
    color:#fff;
    padding:30px;
}

h1{
    font-size:36px;
    margin-bottom:10px;
}

p{
    color:#aaa;
    margin-bottom:30px;
}

.card{
    width:100%;
    max-width:800px;
    background:#242424;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 15px rgba(255,255,255,.08);
}

.btn-back{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    color:#fff;
    background:#2563eb;
    padding:10px 20px;
    border-radius:8px;
    font-weight:bold;
    transition:background .2s;
}

.btn-back:hover{
    background:#1d4ed8;
}
</style>
</head>
<body>

<div class="card">
    <h1>⚙️ Halaman Pengaturan</h1>
    <p>Kelola konfigurasi sistem absensi sekolah di sini.</p>
    
    <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 16px; font-weight: bold; margin-bottom: 8px;">URL Database / Apps Script:</label>
        <input type="text" value="Terhubung ke Google Sheets" disabled style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #111; color: #aaa;">
    </div>

    <a href="admin-dashboard.html" class="btn-back">&larr; Kembali ke Dashboard</a>
</div>

</body>
</html>
