<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekap Bulanan</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#000;
    color:#fff;
    padding:20px;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
}

h1{
    font-size:42px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead th{
    text-align:left;
    padding:15px 10px;
    border-bottom:1px solid #333;
    font-size:18px;
}

tbody td{
    padding:18px 10px;
    font-size:18px;
}

tbody tr:hover{
    background:#111;
}
</style>

</head>
<body>

<div class="container">

<h1>Rekap Bulanan</h1>

<table>

<thead>
<tr>
    <th>Bulan</th>
    <th>Nama</th>
    <th>Hadir</th>
    <th>Terlambat</th>
    <th>Izin</th>
    <th>Tidak Masuk</th>
</tr>
</thead>

<tbody>
<tr>
    <td>Agustus 2026</td>
    <td>Ahmad Muzammil</td>
    <td>25</td>
    <td>1</td>
    <td>0</td>
    <td>0</td>
</tr>

<tr>
    <td>September 2026</td>
    <td>Ahmad Muzammil</td>
    <td>24</td>
    <td>2</td>
    <td>1</td>
    <td>0</td>
</tr>

</tbody>

</table>

</div>

</body>
</html>
